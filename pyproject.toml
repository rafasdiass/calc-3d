[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "calc-3d"
version = "0.1.0"
description = "Structural engineering SaaS — FEM + NBR/EC dimensioning engine"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Rafael Dias" }]

dependencies = [
    # HTTP framework
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",

    # Auth
    "fastapi-users[sqlalchemy]>=13.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",

    # DB / ORM
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",

    # Cache / queue
    "celery>=5.3.0",
    "redis>=5.0.0",

    # Rate limiting
    "slowapi>=0.1.9",

    # Data validation
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.9",
    "email-validator>=2.1.0",

    # Numerical / scientific
    "numpy>=1.26.0",
    "scipy>=1.13.0",

    # Report generation
    "fpdf2>=2.7.0",
    "matplotlib>=3.9.0",

    # IFC parsing (no Qt, no .geom)
    "ifcopenshell>=0.8.0",

    # Observability
    "sentry-sdk[fastapi]>=1.45.0",
    "structlog>=24.1.0",
    "prometheus-client>=0.20.0",

    # HTTP client (testing / webhooks)
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "anyio>=4.3.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-passlib",
    "types-python-jose",
]

[tool.hatch.build.targets.wheel]
packages = ["apps", "core"]

# ─── Ruff ────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["apps", "core", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TCH"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "core"]

# ─── mypy ────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["_legacy/", "tests/"]

# ─── pytest ──────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--tb=short -q"

[tool.coverage.run]
source = ["apps", "core"]
omit = ["_legacy/*", "tests/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
