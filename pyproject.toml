[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "calc-3d"
version = "0.1.0"
description = "Plataforma SaaS de cálculo estrutural e geotécnico conforme normas brasileiras e internacionais"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Rafael", email = "rafael@calc3d.com.br" }]
readme = "README.md"

dependencies = [
    # HTTP
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # Auth
    "fastapi-users[sqlalchemy]>=13.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    # ORM / DB
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    # Pydantic
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    # Async
    "celery>=5.4.0",
    "redis>=5.1.0",
    # Rate limiting
    "slowapi>=0.1.9",
    # Numeric core
    "numpy>=2.1.0",
    "scipy>=1.14.0",
    # Observability
    "structlog>=24.4.0",
    "sentry-sdk[fastapi]>=2.13.0",
    "prometheus-client>=0.21.0",
    # PDF
    "reportlab>=4.2.0",
    # HTTP utils
    "httpx>=0.27.0",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "types-passlib>=1.7.7",
    "types-python-jose>=3.3.4",
]

[project.scripts]
calc3d-api = "apps.api.main:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "core*", "infra*"]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["apps", "core", "infra", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "ANN",  # flake8-annotations (type hints)
    "S",    # flake8-bandit (security)
    "RUF",  # ruff-specific
]
ignore = [
    "ANN101",  # missing type annotation for self
    "ANN102",  # missing type annotation for cls
    "S101",    # use of assert (allowed in tests)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN", "S"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "core", "infra"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
exclude = ["_legacy/", "tests/"]

[[tool.mypy.overrides]]
module = ["celery.*", "redis.*", "fastapi_users.*", "alembic.*", "reportlab.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--tb=short",
    "--strict-markers",
]
markers = [
    "unit: pure unit tests, no I/O",
    "integration: tests that require DB/Redis",
    "benchmark: cross-validation against reference books",
]

# ---------------------------------------------------------------------------
# coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["apps", "core"]
omit = ["_legacy/*", "tests/*", "*/migrations/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
