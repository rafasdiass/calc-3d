[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "calc-3d"
version = "0.1.0"
description = "Structural foundation calculator — multi-tenant SaaS API"
readme = "README.md"
license = { text = "Proprietary" }
requires-python = ">=3.11"

dependencies = [
    # API
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic[email]>=2.7.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[argon2]>=1.7.4",

    # Worker
    "celery>=5.4.0",
    "redis>=5.0.4",

    # DB (Sprint 1)
    "sqlalchemy>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",

    # HTTP client (Sprint 1 — integração TQS)
    "httpx>=0.27.0",

    # Utilities
    "python-dotenv>=1.0.1",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",   # TestClient
    "ruff>=0.4.4",
    "mypy>=1.10.0",
]

[project.scripts]
calc3d-api = "apps.api.main:app"

[tool.hatch.build.targets.wheel]
packages = ["apps", "core", "infra"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--tb=short -q"

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "PIE", "SIM"]
ignore = ["E501"]

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
